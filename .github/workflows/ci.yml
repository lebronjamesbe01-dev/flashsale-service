name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: maven

      - name: Build, format check, architecture rules and integration tests
        run: ./mvnw -B verify

      - name: Docker image builds
        run: docker build -t flashsale-service:ci .

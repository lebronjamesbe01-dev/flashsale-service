spring:
  application:
    name: flashsale-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/flashsale}
    username: ${DB_USER:flashsale}
    password: ${DB_PASSWORD:flashsale}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:flashsale}
    password: ${RABBITMQ_PASSWORD:flashsale}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis,rabbit

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  time:
    zone: Asia/Ho_Chi_Minh
  auth:
    issuer: flashsale-service
    # No defaults on purpose: the app refuses to start without real secrets (32+ bytes each).
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    otp-hmac-key: ${OTP_HMAC_KEY}
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-resend-cooldown: 60s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

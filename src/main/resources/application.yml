spring:
  application:
    name: flashsale-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/flashsale}
    username: ${DB_USER:flashsale}
    password: ${DB_PASSWORD:flashsale}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:flashsale}
    password: ${RABBITMQ_PASSWORD:flashsale}
    # The outbox relay only marks an event sent after the broker confirms it.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 50
        concurrency: 2
        max-concurrency: 4
        # Ride out short outages (DB restart, pool exhaustion) before giving up: 1s, 3s, 9s.
        # After the last attempt the message is rejected and moves to flashsale.dead-letters.
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 3
          max-interval: 30s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Only the database is required to serve traffic. Redis and RabbitMQ have fallbacks
        # (fail open / outbox buffering), so their outage must not pull every instance out of the
        # load balancer. Start-up order is handled by docker compose depends_on.
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  time:
    zone: Asia/Ho_Chi_Minh
  auth:
    issuer: flashsale-service
    # No defaults on purpose: the app refuses to start without real secrets (32+ bytes each).
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    otp-hmac-key: ${OTP_HMAC_KEY}
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-resend-cooldown: 60s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

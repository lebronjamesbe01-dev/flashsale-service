worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker's internal DNS. Re-resolving "app" every 10s means instances added with
    # "docker compose up --scale app=N" start receiving traffic without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream app_backend {
        zone app_backend 64k;
        server app:8080 resolve;
        keepalive 64;
    }

    # Reuse the caller's X-Request-Id or create one, and pass it on, so nginx and app logs share the id.
    map $http_x_request_id $rid {
        ""      $request_id;
        default $http_x_request_id;
    }

    # The port the client actually used (8088 on the host), so generated URLs such as the
    # OpenAPI server address keep it; nginx itself only sees its container port 80.
    map $http_host $client_port {
        "~:(?<p>[0-9]+)$" $p;
        default           80;
    }

    log_format main '$remote_addr "$request" $status $request_time upstream=$upstream_addr rid=$rid';
    access_log /dev/stdout main;

    server {
        listen 80;

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-Id $rid;
            # Overwrite, never append: a client-supplied X-Forwarded-For must not fake its IP (rate limits).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $client_port;
            proxy_next_upstream error timeout;
        }
    }
}
